[project]
name = "hr-agent"
version = "0.1.0"
description = "人力 AI 智能体（考勤请假），veADK + AgentKit"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==0.3.7",
    "veadk-python==1.1.0",
    "agentkit-sdk-python==0.8.1",
    "google-adk==2.2.0",
    "urllib3<2.0.0",
    "volcengine==1.0.226",
    "volcengine-python-sdk==5.0.42",
    "litellm",
    "requests>=2.31",
    "pydantic>=2.7",
    "markitdown[pdf,docx,xlsx]>=0.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "responses>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests/agentkit"]
addopts = "--tb=short --no-showlocals"
markers = [
    # 当前验收态：AgentKit 远端 HTTP 客户端门禁
    "agentkit: tests/agentkit 下的 AgentKit 远端 HTTP 客户端验收（默认 testpaths）",
    "wp01_remote_acceptance: WP01 环境前置检查（tests/agentkit/test_wp01_environment.py），远端 AgentKit 服务端 preflight/服务端 Readiness 语义",
    # 历史本地 markers：仅标记历史套件，不承载当前验收入口
    "eval: 需要真实方舟模型 Key 的对话评测（历史，已不作为当前验收入口）",
    "consult_eval: 独立Consult Agent真实模型与Knowledge评测（历史）",
    "employee_data_eval: 独立Employee Data Agent真实模型与Stub评测（历史）",
    "integration: 需要真实外部资源的集成测试（历史）",
    "a2a: 通过官方A2A客户端执行的本地协议测试（历史）",
    "employee_data_a2a: Employee Data官方A2A本地网络测试（历史）",
    "multi_agent_a2a: 三服务本地显式A2A闭环门禁（历史）",
    "a2a_eval: 根入口在a2a/a2a模式下的21条核心业务评测（历史）",
    "protocol: 只用录制/协议层验证公共A2A契约（历史，不承担业务迁移验收）",
    "production_topology: 生产拓扑stub E2E验收（历史）",
]
