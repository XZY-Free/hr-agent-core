# tests/eval/cases.yaml —— 对话评测首批 12 条
# 字段说明：
#   turns: 多轮对话的用户消息列表（按顺序发送）
#   expect_tool: 断言这些工具被调用过
#   expect_no_tool: 断言这些工具【未被调用】
#   expect_keywords: 最终回复必含的关键词列表（全部命中才算通过）
#   expect_marker: 最终回复必含的 JUMP 标记（如 [[JUMP:punch-details]]）
#
# 挂桩策略：monkeypatch hr_agent.tools.gaia.client.GaiaClient.request，
# 按 path 分派固定响应（员工 sex=F、排班 7-27 OFF、年假余额 remain=4 等）。

- id: quick_tomorrow
  # 多轮：首轮模型复述确认（prompt 规定提交前必须复述），用户确认后才 submit
  turns: ["明天请一天年休假", "确认"]
  expect_tool: [get_schedule, submit_leave]
  expect_keywords: ["年休假"]

- id: missing_type_asks
  turns: ["我明天想请假"]
  expect_no_tool: [submit_leave]        # 缺类型必须追问而不是直接提交

- id: multi_type_rejected
  # 多种假期应引导分开提交；模型可能用"分开"或"先选其中一种"等同义表达
  turns: ["我要请年假和事假"]
  expect_any_keyword: ["分开", "一种"]

- id: gender_mismatch
  # 陪产假仅限男性，挂桩员工 sex=F。模型不知性别，须走 submit_leave 校验才发现不符。
  # prompt 规定提交前复述确认，故多轮：复述→确认→submit 性别校验失败→转述。
  # 性别校验在 submit 校验链第 2 步（排班校验之前），先于排班返回。
  # 日期用 stub 排班覆盖范围内的 07-30（白班），避免模型查排班拿不到数据陷入循环
  turns: ["7月30号请一天陪产假", "确认"]   # 挂桩员工 sex=F，07-30 白班
  expect_tool: [submit_leave]
  expect_keywords: ["陪产假"]
  expect_any_keyword: ["无法", "仅限", "不符"]

- id: rest_day
  # 今天 07-29，7月27号为前天（补登，休息日）。验"休息日校验"最稳定的行为信号：
  # 模型必须查排班（get_schedule）才能识别出 07-27 是休息日。
  # 后续处理有波动（告知休息/追问换天/走submit被拒），均为识别休息日的正确后续，不强约束
  turns: ["7月27号请一天事假", "确认"]    # 挂桩排班 27 日 OFF
  expect_tool: [get_schedule]

- id: balance_query
  # "还有几天年假"可走 get_leave_balance，也可走更完整的组合工具 calc_annual_leave
  # （后者内部也会调 get_leave_balance，含工龄折算，答得更完整）
  turns: ["我还有几天年假？"]
  expect_any_tool: [get_leave_balance, calc_annual_leave]

- id: annual_calc
  turns: ["我的年假是怎么折算的？"]
  expect_tool: [calc_annual_leave]

- id: page_jump_punch
  turns: ["打开打卡明细"]
  expect_marker: "[[JUMP:punch-details]]"

- id: cancel_leave
  turns: ["我要取消昨天提交的请假"]
  expect_keywords: ["我的表单"]

- id: handoff
  turns: ["转人工"]
  expect_keywords: ["转人工"]

- id: consult_transfer
  turns: ["迟到扣款制度是什么样的"]
  expect_tool: [kb_search]
  expect_not_keywords: ["敬请期待"]

# ---------- 二期咨询评测 10 条 ----------
- id: policy_late_fine
  # 真库《华润啤酒考勤休假管理制度》：迟到按每10分钟扣20元分段计费（非固定五十元）
  turns: ["迟到会被罚钱吗"]
  expect_tool: [kb_search]
  expect_keywords: ["扣工资"]

- id: non_hr_rejected
  turns: ["我电脑坏了怎么报修"]
  expect_no_tool: [kb_search]
  expect_keywords: ["部门"]

- id: childcare_sichuan
  turns: ["四川的育儿假有几天"]
  expect_tool: [kb_search]
  expect_keywords: ["10"]   # 真库：四川省育儿假 10天/年（模型常用数字"10天"表述）

- id: childcare_asks_province
  turns: ["育儿假有几天"]
  expect_no_tool: [kb_search]

- id: salary_term_alias
  turns: ["餐补的标准在哪看"]
  expect_tool: [kb_search]

- id: kb_empty_honest
  # 非人力范畴问题（宠物入职）应被正确拒答，不检索知识库、建议咨询对应部门
  turns: ["公司对宠物入职有什么规定"]
  expect_no_tool: [kb_search]
  expect_keywords: ["部门"]

- id: personal_data_not_kb
  turns: ["帮我看看我还有几天医疗期"]
  expect_tool: [get_medical_period]
  expect_no_tool: [kb_search]

- id: doc_qa
  turns: ["https://example.com/notice.docx 这份文件说了什么"]
  expect_tool: [parse_document]

- id: followup_present
  turns: ["年假能跨年用吗"]
  expect_keywords: ["还想了解"]

- id: consult_transfer
  turns: ["公司的病假工资制度是怎么规定的"]
  expect_tool: [kb_search]
  expect_not_keywords: ["敬请期待"]

- id: transparent_data
  # _transparent_data_ 是前端表单回填，数据已齐。验证回填数据被正确解析并响应：
  # 回复须含正确类型（年休假）。后续行为有波动——直接提交或复述确认都合理，
  # 故用 expect_any_keyword 容纳"提交"/"确认"两种路径，不强求走 submit_leave
  turns: ["_transparent_data_{\"typeName\":\"年休假\",\"startDate\":\"2026-07-28\",\"endDate\":\"2026-07-28\",\"startTime\":\"08:00\",\"endTime\":\"17:00\",\"reasons\":\"家事\"}"]
  expect_keywords: ["年休假"]
  expect_any_keyword: ["提交", "确认"]
