# tests/eval/cases.yaml —— 对话评测 22 条
# 字段说明：
#   turns: 多轮对话的用户消息列表（按顺序发送）
#   expect_tool / expect_any_tool: 断言这些工具被调用过 / 命中其一即可
#   expect_no_tool: 断言这些工具【未被调用】
#   expect_keywords / expect_any_keyword: 【最后一轮】回复必含 / 含其一
#   expect_keywords_anywhere / expect_any_keyword_anywhere:
#       【任意轮】回复出现过即可。多轮 case 里"结论出现在哪一轮"取决于模型效率，
#       验"说过某结论"时用这组；验"最终回复必须是什么"才用上面那组
#   expect_not_keywords: 最终回复必不含
#   expect_marker: 最终回复必含的 JUMP 标记（如 [[JUMP:punch-details]]）
#
# 口语日期（"明天""前天"）交给模型换算——那本身就是被测能力。若某条 case 需要
# 写死真实日期，可用占位符 <today>/<tomorrow>/<yesterday>/<rest_day>，由 test_eval
# 替换为相对今天的日期（当前无 case 使用）。
# stub 排班窗口为 today-7..today+14，其中 today-2 为休息日。
#
# 挂桩：monkeypatch GaiaClient.request 按 path 分派（员工 sex=F、年假余额 4 天、
# 医疗期余额 21 天、前天为休息日）。断言尽量咬住这些桩数据，验答案而非只验路由。

- id: quick_tomorrow
  # 多轮：首轮模型复述确认（prompt 规定提交前必须复述），用户确认后才 submit。
  # "提交"作必含词而非枚举成功措辞——模型说法多变（"已提交"/"已成功提交"/
  # "提交成功"），枚举必然漏；配合 expect_tool 的 submit_leave 已足够严格
  turns: ["明天请一天年休假", "确认"]
  expect_tool: [get_schedule, submit_leave]
  expect_keywords: ["年休假", "提交"]

- id: missing_type_asks
  # 缺类型必须追问而不是直接提交。只验必含"类型"二字——追问措辞多变
  #（"什么类型"/"类型是什么"/"哪种类型"），枚举短语必然漏；不提交由
  # expect_no_tool 保证
  turns: ["我明天想请假"]
  expect_no_tool: [submit_leave]
  expect_keywords: ["类型"]

- id: multi_type_rejected
  # 多种假期应引导分开提交；模型可能用"分开"或"先选其中一种"等同义表达
  turns: ["我要请年假和事假"]
  expect_any_keyword: ["分开", "一种"]

- id: gender_mismatch
  # 陪产假仅限男性，挂桩员工 sex=F。模型不知性别，须走 submit_leave 校验才发现不符。
  # prompt 规定提交前复述确认，故多轮：复述→确认→submit 性别校验失败→转述。
  # 用"明天"（stub 排班窗口内的白班），避免查不到排班陷入重试循环
  turns: ["明天请一天陪产假", "确认"]
  expect_tool: [submit_leave]
  expect_keywords: ["陪产假"]
  expect_any_keyword: ["无法", "仅限", "不符"]

- id: rest_day
  # 前天（stub 休息日）补登事假。验"识别出休息日并告知用户"这一行为，不押识别路径：
  # ① 先查排班（get_schedule）提前发现；② 直接 submit_leave 被校验链拦截后转述——
  # 校验链本来就是设计好的兜底（2026-07-30 实测模型两条都走过，行为都正确）。
  # 结论出现在哪一轮也取决于模型效率（高效时第 1 轮查完直接告知），故关键词用 _anywhere。
  turns: ["前天请一天事假", "确认"]
  expect_any_tool: [get_schedule, submit_leave]
  expect_any_keyword_anywhere: ["休息", "无需请假", "不用请假", "不需要请假"]

- id: balance_query
  # "还有几天年假"可走 get_leave_balance，也可走更完整的组合工具 calc_annual_leave
  # （后者内部也会调 get_leave_balance）。验答出桩数据的 4 天，不只验调了工具
  turns: ["我还有几天年假？"]
  expect_any_tool: [get_leave_balance, calc_annual_leave]
  expect_any_keyword: ["4天", "4 天", "四天"]

- id: annual_calc
  # 桩员工工龄 6 年（<10 年档）→ 折算 5 天
  turns: ["我的年假是怎么折算的？"]
  expect_tool: [calc_annual_leave]
  expect_any_keyword: ["5天", "5 天", "五天"]

- id: page_jump_punch
  turns: ["打开打卡明细"]
  expect_marker: "[[JUMP:punch-details]]"

- id: cancel_leave
  # 取消请假不该只是"告诉用户自己去【我的表单】"——页面跳转是智能体本来就有的
  # 能力，应当直接把用户送到页面。故验 page_jump 被调用且标记注入成功
  turns: ["我要取消昨天提交的请假"]
  expect_tool: [page_jump]
  expect_marker: "[[JUMP:my-forms]]"
  expect_keywords: ["我的表单"]

- id: handoff
  # 验固定话术的特征词"转接"——"转人工"是用户输入词，复述即中，验了等于没验
  turns: ["转人工"]
  expect_keywords: ["转接"]

- id: consult_transfer
  turns: ["迟到扣款制度是什么样的"]
  expect_tool: [kb_search]
  expect_keywords: ["扣"]
  expect_not_keywords: ["敬请期待"]

# ---------- 二期咨询评测 10 条 ----------
- id: policy_late_fine
  # 真库《华润啤酒考勤休假管理制度》：迟到按每 10 分钟扣 20 元分段计费。
  # 验检索到的是分段计费细节，而非笼统一句"会扣工资"
  turns: ["迟到会被罚钱吗"]
  expect_tool: [kb_search]
  expect_keywords: ["扣工资"]
  expect_any_keyword: ["分钟", "元"]

- id: non_hr_rejected
  # 非人力范畴要拒答并引导。验"引导去别处求助"这个动作而非具体部门名——
  # 模型可能说"IT部门"也可能说"IT部"，枚举部门名必然漏（kb_empty_honest 踩过）
  turns: ["我电脑坏了怎么报修"]
  expect_no_tool: [kb_search]
  expect_any_keyword: ["咨询", "联系", "部门", "转人工"]

- id: childcare_sichuan
  # 真库：四川省育儿假 10 天/年。带单位断言，避免 "10月"/"2010" 之类假命中
  turns: ["四川的育儿假有几天"]
  expect_tool: [kb_search]
  expect_any_keyword: ["10天", "10 天", "十天"]

- id: childcare_asks_province
  # 育儿假按省份而异，未说省份应先追问，不该盲检索
  turns: ["育儿假有几天"]
  expect_no_tool: [kb_search]
  expect_any_keyword: ["省", "地区", "哪个", "所在"]

- id: salary_term_alias
  # "餐补"是口语别名，需映射到薪酬福利库检索，且不能落到"敬请期待"兜底话术
  turns: ["餐补的标准在哪看"]
  expect_tool: [kb_search]
  expect_not_keywords: ["敬请期待"]

- id: kb_empty_honest
  # 本意（见 id）：知识库覆盖不到的问题要诚实回答、不编造。实测模型在两条都正确
  # 的路径间摆动：① 先检索求证 → 没命中 → 如实说没查到 + 建议人力资源部门；
  # ② 直接判断非人力范畴 → 建议行政部门（更高效，省 3 次检索）。故不约束工具——
  # 在"检索/不检索"上做硬断言，无论押哪边都会周期性掉红。
  # 工具路由已分别由 non_hr_rejected（明确非人力→不检索）与 consult_transfer
  #（明确人力→检索）覆盖，这条只验诚实性：如实说没有 + 引导对应部门，不编造制度。
  turns: ["公司对宠物入职有什么规定"]
  expect_any_keyword: ["咨询", "联系", "部门", "转人工"]
  expect_any_keyword_anywhere: ["没有查到", "未查到", "没有找到", "暂时没有", "不属于"]

- id: personal_data_not_kb
  # 个人数据走盖亚接口而非知识库；验答出桩数据的 21 天余额
  turns: ["帮我看看我还有几天医疗期"]
  expect_tool: [get_medical_period]
  expect_no_tool: [kb_search]
  expect_keywords: ["21"]

- id: doc_qa
  # 挂桩文档是多段落的春节假期通知（放假时间/值班安排/考勤要求三条）。验模型
  # 真读懂并转述了关键信息，而非只调了工具——早先桩内容是单行 "hello world"，
  # 太短会诱导模型照抄原文（连转义符一起抄），验不到文档理解能力
  turns: ["https://example.com/notice.docx 这份文件说了什么"]
  expect_tool: [parse_document]
  expect_keywords: ["值班"]
  expect_any_keyword: ["春节", "放假", "假期"]
  expect_not_keywords: ["\\n"]   # 不应把转义符原样吐出来

- id: followup_present
  turns: ["年假能跨年用吗"]
  expect_keywords: ["还想了解"]

- id: policy_probation
  # 原为 policy_sick_pay（"病假工资制度"），但真库没有病假工资内容——三种问法
  # top score 均 ≤0.29，召回的都是医疗期天数表与病假条审批规则。模型据此诚实
  # 拒答是正确行为，可这条 case 就验不到"制度咨询"能力了（拒答已由
  # kb_empty_honest 覆盖），断言全绿反而掩盖了知识库缺口。缺口记在 CHECKLIST B。
  # 换成真库覆盖良好的试用期转正（top score 0.356），同时补上现有 22 条完全
  # 没覆盖的"入离职/人事办理"范畴。
  turns: ["试用期转正的审批流程是什么"]
  expect_tool: [kb_search]
  expect_keywords: ["转正"]
  expect_any_keyword: ["HRBP", "推送", "发起", "审批"]
  expect_not_keywords: ["敬请期待"]
