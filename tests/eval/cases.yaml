# tests/eval/cases.yaml —— 对话评测 22 条
# 字段说明：
#   turns: 多轮对话的用户消息列表（按顺序发送）
#   expect_tool / expect_any_tool: 断言这些工具被调用过 / 命中其一即可
#   expect_no_tool: 断言这些工具【未被调用】
#   expect_keywords / expect_any_keyword: 最终回复必含 / 含其一
#   expect_not_keywords: 最终回复必不含
#   expect_marker: 最终回复必含的 JUMP 标记（如 [[JUMP:punch-details]]）
#
# 日期占位符 <today>/<tomorrow>/<yesterday>/<rest_day> 由 test_eval 替换为真实
# 日期（相对今天）。口语日期（"明天""前天"）不替换，交给模型换算——那本身就是
# 被测能力。stub 排班窗口为 today-7..today+14，其中 today-2 为休息日。
#
# 挂桩：monkeypatch GaiaClient.request 按 path 分派（员工 sex=F、年假余额 4 天、
# 医疗期余额 21 天、前天为休息日）。断言尽量咬住这些桩数据，验答案而非只验路由。

- id: quick_tomorrow
  # 多轮：首轮模型复述确认（prompt 规定提交前必须复述），用户确认后才 submit。
  # "提交"作必含词而非枚举成功措辞——模型说法多变（"已提交"/"已成功提交"/
  # "提交成功"），枚举必然漏；配合 expect_tool 的 submit_leave 已足够严格
  turns: ["明天请一天年休假", "确认"]
  expect_tool: [get_schedule, submit_leave]
  expect_keywords: ["年休假", "提交"]

- id: missing_type_asks
  # 缺类型必须追问而不是直接提交——同时验"确实问了类型"，不只是没提交
  turns: ["我明天想请假"]
  expect_no_tool: [submit_leave]
  expect_any_keyword: ["什么类型", "哪种", "假期类型", "什么假", "哪一种"]

- id: multi_type_rejected
  # 多种假期应引导分开提交；模型可能用"分开"或"先选其中一种"等同义表达
  turns: ["我要请年假和事假"]
  expect_any_keyword: ["分开", "一种"]

- id: gender_mismatch
  # 陪产假仅限男性，挂桩员工 sex=F。模型不知性别，须走 submit_leave 校验才发现不符。
  # prompt 规定提交前复述确认，故多轮：复述→确认→submit 性别校验失败→转述。
  # 用"明天"（stub 排班窗口内的白班），避免查不到排班陷入重试循环
  turns: ["明天请一天陪产假", "确认"]
  expect_tool: [submit_leave]
  expect_keywords: ["陪产假"]
  expect_any_keyword: ["无法", "仅限", "不符"]

- id: rest_day
  # 前天（stub 休息日）补登事假。验模型查了排班【并且】把"当天不用请假"的结论
  # 告知用户——无论走"查排班后直接告知"还是"走 submit 被拒后转述话术"都算对，
  # 措辞按两条路径的常见说法枚举
  turns: ["前天请一天事假", "确认"]
  expect_tool: [get_schedule]
  expect_any_keyword: ["休息", "无需请假", "不用请假", "不需要请假"]

- id: balance_query
  # "还有几天年假"可走 get_leave_balance，也可走更完整的组合工具 calc_annual_leave
  # （后者内部也会调 get_leave_balance）。验答出桩数据的 4 天，不只验调了工具
  turns: ["我还有几天年假？"]
  expect_any_tool: [get_leave_balance, calc_annual_leave]
  expect_any_keyword: ["4天", "4 天"]

- id: annual_calc
  # 桩员工工龄 6 年（<10 年档）→ 折算 5 天
  turns: ["我的年假是怎么折算的？"]
  expect_tool: [calc_annual_leave]
  expect_any_keyword: ["5天", "5 天"]

- id: page_jump_punch
  turns: ["打开打卡明细"]
  expect_marker: "[[JUMP:punch-details]]"

- id: cancel_leave
  turns: ["我要取消昨天提交的请假"]
  expect_keywords: ["我的表单"]

- id: handoff
  # 验固定话术的特征词"转接"——"转人工"是用户输入词，复述即中，验了等于没验
  turns: ["转人工"]
  expect_keywords: ["转接"]

- id: consult_transfer
  turns: ["迟到扣款制度是什么样的"]
  expect_tool: [kb_search]
  expect_keywords: ["扣"]
  expect_not_keywords: ["敬请期待"]

# ---------- 二期咨询评测 10 条 ----------
- id: policy_late_fine
  # 真库《华润啤酒考勤休假管理制度》：迟到按每 10 分钟扣 20 元分段计费。
  # 验检索到的是分段计费细节，而非笼统一句"会扣工资"
  turns: ["迟到会被罚钱吗"]
  expect_tool: [kb_search]
  expect_keywords: ["扣工资"]
  expect_any_keyword: ["分钟", "元"]

- id: non_hr_rejected
  turns: ["我电脑坏了怎么报修"]
  expect_no_tool: [kb_search]
  expect_keywords: ["部门"]

- id: childcare_sichuan
  # 真库：四川省育儿假 10 天/年。带单位断言，避免 "10月"/"2010" 之类假命中
  turns: ["四川的育儿假有几天"]
  expect_tool: [kb_search]
  expect_any_keyword: ["10天", "10 天"]

- id: childcare_asks_province
  # 育儿假按省份而异，未说省份应先追问，不该盲检索
  turns: ["育儿假有几天"]
  expect_no_tool: [kb_search]
  expect_any_keyword: ["省", "地区", "哪个", "所在"]

- id: salary_term_alias
  # "餐补"是口语别名，需映射到薪酬福利库检索，且不能落到"敬请期待"兜底话术
  turns: ["餐补的标准在哪看"]
  expect_tool: [kb_search]
  expect_not_keywords: ["敬请期待"]

- id: kb_empty_honest
  # 非人力范畴问题（宠物入职）应被正确拒答，不检索知识库、建议咨询对应部门
  turns: ["公司对宠物入职有什么规定"]
  expect_no_tool: [kb_search]
  expect_keywords: ["部门"]

- id: personal_data_not_kb
  # 个人数据走盖亚接口而非知识库；验答出桩数据的 21 天余额
  turns: ["帮我看看我还有几天医疗期"]
  expect_tool: [get_medical_period]
  expect_no_tool: [kb_search]
  expect_keywords: ["21"]

- id: doc_qa
  # 挂桩文档内容为 "# test\nhello world"，验真的读了文档而非只调了工具
  turns: ["https://example.com/notice.docx 这份文件说了什么"]
  expect_tool: [parse_document]
  expect_any_keyword: ["hello", "test"]

- id: followup_present
  turns: ["年假能跨年用吗"]
  expect_keywords: ["还想了解"]

- id: policy_sick_pay
  turns: ["公司的病假工资制度是怎么规定的"]
  expect_tool: [kb_search]
  expect_not_keywords: ["敬请期待"]

- id: transparent_data
  # _transparent_data_ 是前端表单回填，数据已齐。核心要验的是回填字段被准确解析：
  # 类型（年休假）与事由（家事）都须出现在复述里。后续行为有波动——直接提交或
  # 复述确认都是正确路径，且征询确认的措辞不定（"确认一下"/"对吗"/"是否正确"），
  # 故用 expect_any_keyword 容纳，不强求走 submit_leave
  turns: ["_transparent_data_{\"typeName\":\"年休假\",\"startDate\":\"<tomorrow>\",\"endDate\":\"<tomorrow>\",\"startTime\":\"08:00\",\"endTime\":\"17:00\",\"reasons\":\"家事\"}"]
  expect_keywords: ["年休假", "家事"]
  expect_any_keyword: ["提交", "确认", "对吗", "是否", "核对"]
